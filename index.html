<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tokyo Family Weekend</title>
<meta name="theme-color" content="#1b2130" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tokyo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
<style>
/* Layout: a four-view phone app (Now, Plan, Map, Essentials). On wide screens Plan shows list + timeline side by side. */
:root{
  --bg:#f3f4f6; --paper:#ffffff; --fg:#1b2130; --muted:#5f6778; --line:#d9dde6;
  --ink:#2a4a8c; --ink-soft:#e4ebf8; --yes:#cc3d2a; --yes-soft:#fbe6e2; --maybe:#b8780f; --maybe-soft:#fbefd4; --no:#8a8f9c;
  --ok:#2f7d4f; --ok-soft:#e2f3e8;
  --display:"Shippori Mincho B1",Georgia,serif; --body:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141821; --paper:#1c212c; --fg:#e8eaf0; --muted:#a0a7b8; --line:#2d3442;
  --ink:#8fa9e8; --ink-soft:#232d44; --yes:#ff7a66; --yes-soft:#3a1f1b; --maybe:#e8b45a; --maybe-soft:#3a2d14; --no:#6e7380; --ok:#6cc48f; --ok-soft:#1d3327}}
:root[data-theme="dark"]{
  --bg:#141821; --paper:#1c212c; --fg:#e8eaf0; --muted:#a0a7b8; --line:#2d3442;
  --ink:#8fa9e8; --ink-soft:#232d44; --yes:#ff7a66; --yes-soft:#3a1f1b; --maybe:#e8b45a; --maybe-soft:#3a2d14; --no:#6e7380; --ok:#6cc48f; --ok-soft:#1d3327}
*{box-sizing:border-box}
html{min-height:100%}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--ink)}
button{font:inherit}
h1{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,30px);line-height:1.1;margin:0;letter-spacing:-.01em}
h2{font-family:var(--display);font-size:17px;margin:0 0 4px;font-weight:600}
.wrapper{max-width:1240px;margin:0 auto;width:100%}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"title clock" "status clock";align-items:end;column-gap:12px;padding-block:14px 8px}
.top h1{grid-area:title}.top .status{grid-area:status}.top .clock{grid-area:clock;min-width:0}
@media (max-width:480px){.top{grid-template-columns:minmax(0,1fr);grid-template-areas:"title" "clock" "status"}.clock{text-align:left;padding:2px 0 4px}.clock br{display:none}.clock b+br+*{margin-left:8px}}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;text-align:right;line-height:1.3;overflow-wrap:anywhere}
.clock b{color:var(--fg);font-weight:600}
.status{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--no);display:inline-block}
.dot.ok{background:var(--ok)} .dot.err{background:var(--yes)} .dot.busy{background:var(--maybe)}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{flex:1;max-width:160px;background:transparent;border:0;color:var(--muted);font-size:11px;font-weight:600;padding:6px 0 2px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--ink)}
section.view{display:none}
section.view.on{display:block}
/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card + .card{margin-top:12px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 8px}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.stars{font-weight:500;font-size:13px;color:var(--maybe);white-space:nowrap;font-variant-numeric:tabular-nums;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--paper);color:var(--fg)}
.pill.yes{color:var(--yes);border-color:transparent;background:var(--yes-soft)}
.pill.maybe{color:var(--maybe);border-color:transparent;background:var(--maybe-soft)}
.pill.ink{color:var(--ink);border-color:transparent;background:var(--ink-soft)}
.pill.ok{color:var(--ok);border-color:transparent;background:var(--ok-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--fg);border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px;text-decoration:none}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--yes);border-color:var(--yes)}
.btn.small{min-height:32px;padding:4px 10px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* tabs and chips */
.tabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:6px 0 10px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--paper);color:var(--fg);border-radius:8px;padding:8px 13px;font-weight:500;cursor:pointer;white-space:nowrap;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink-soft);color:var(--ink);border-color:transparent;font-weight:600}
.chip.add{margin-left:auto;background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.btn.suggest{width:100%;border-style:dashed;color:var(--ink);background:transparent;margin-top:4px}
/* plan list */
.plan{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:900px){.plan{grid-template-columns:minmax(0,1fr) 380px;align-items:start}.plan .aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}
.list{display:flex;flex-direction:column;gap:12px;min-width:0}
.slot{display:flex;flex-direction:column;gap:6px}
.slot .t{font-family:var(--display);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;padding-top:4px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:28px minmax(0,1fr);grid-template-areas:"num body" "acts acts";gap:8px 10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;min-width:0}
.row.plan{border-left:4px solid var(--ink)}
.row.sel{box-shadow:0 0 0 2px var(--ink)}
.row.st-yes{border-color:var(--yes)}
.row.st-no{opacity:.55}
.row.done .name{text-decoration:line-through;color:var(--muted)}
.row.skip{opacity:.5}
.num{grid-area:num;width:26px;height:26px;border-radius:50%;background:var(--ink-soft);color:var(--ink);font-weight:700;font-size:12px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.row.plan .num{background:var(--ink);color:#fff}
.row.st-yes .num{background:var(--yes);color:#fff}
.row.done .num{background:var(--ok);color:#fff}
.body{grid-area:body;min-width:0}
.name{font-weight:700;margin:0 0 2px;font-size:15.5px}
.note{color:var(--muted);font-size:14px;margin:0}
.usernote{margin:6px 0 0;font-size:14px;padding:6px 8px;background:var(--maybe-soft);border-radius:6px;color:var(--fg)}
.hours{font-size:12.5px;color:var(--muted);margin-top:4px}
.resv{display:inline-block;font:inherit;font-size:12.5px;font-weight:600;border-radius:6px;padding:3px 8px;margin:4px 0 2px;border:1px solid transparent;cursor:pointer}
.resv.ok{background:var(--ok-soft);color:var(--ok)} .resv.warn{background:var(--yes-soft);color:var(--yes)} .resv.soft{background:var(--maybe-soft);color:var(--maybe)}
.resv.walkin{background:transparent;color:var(--muted);border-color:var(--line);font-weight:500;cursor:default}
.resvflag{color:var(--yes);font-size:12px;font-weight:600} .resvok{color:var(--ok);font-size:12px;font-weight:600}
.hours.warn{color:var(--yes);font-weight:600}
.hours.open{color:var(--ok)}
.meta{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:13px}
.meta a{font-weight:500}
.phone{font-variant-numeric:tabular-nums;display:inline-flex;gap:6px;align-items:center}
.copy{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer}
.when{font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:transparent;border:0;padding:0;cursor:pointer;font-weight:600}
.acts{grid-area:acts;display:flex;gap:6px;flex-wrap:wrap;width:100%;max-width:620px;margin-top:2px}
.pick{flex:1 1 26%;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-weight:700;font-size:16px;cursor:pointer}
.pick[data-s="yes"].on{background:var(--yes);border-color:var(--yes);color:#fff}
.pick[data-s="maybe"].on{background:var(--maybe);border-color:var(--maybe);color:#fff}
.pick[data-s="no"].on{background:var(--no);border-color:var(--no);color:#fff}
.book{flex:1 1 46%;height:42px;border-radius:8px;border:1px dashed var(--line);background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer}
.book.on{border-style:solid;border-color:var(--ink);background:var(--ink);color:#fff}
.doneb{flex:1 1 46%;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.doneb.on{background:var(--ok);border-color:var(--ok);color:#fff}
.doneb.skipon{background:var(--no);border-color:var(--no);color:#fff}
.editwhen{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px;padding:10px;background:var(--bg);border-radius:8px}
.editwhen label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.editwhen select,.editwhen input,.editwhen textarea{font:inherit;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--fg);min-height:40px;width:100%}
.editwhen textarea{grid-column:1/-1;min-height:60px;resize:vertical}
.editwhen .full{grid-column:1/-1}
.editwhen .ebtns{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
/* timeline */
.tlday{font-weight:700;margin:12px 0 4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tlev{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:baseline;padding:6px 0 6px 10px;cursor:pointer;border-left:3px solid var(--ink);border-radius:2px}
.tlev.anchor{border-left-color:var(--muted)}
.tlev.done{opacity:.5}
.tlev.sel{background:var(--ink-soft)}
.tlt{font-variant-numeric:tabular-nums;font-weight:700}
.tlt small,.tln small{display:block;color:var(--muted);font-weight:400;font-size:12px;line-height:1.35}
.tln{font-weight:500}
.tlgo{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);padding:3px 0 3px 13px;margin-left:1px;border-left:1px dashed var(--line)}
.tlgo b{font-weight:600}
.tlgo.tight{color:var(--yes)} .tlgo.ok{color:var(--maybe)}
/* now view */
.nowgrid{display:grid;gap:12px}
@media (min-width:900px){.nowgrid{grid-template-columns:1fr 1fr}}
.big{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.1;margin:2px 0 4px}
.countdown{font-size:15px;color:var(--muted);margin:0 0 6px}
.countdown b{color:var(--fg);font-variant-numeric:tabular-nums}
.leaveby{display:inline-block;padding:6px 10px;border-radius:8px;background:var(--ink-soft);color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;margin:4px 0 8px}
.leaveby.tight{background:var(--yes-soft);color:var(--yes)}
.compact{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.compact .item{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--bg);cursor:pointer;font-size:14px}
.compact .item.done{opacity:.5;text-decoration:line-through}
.compact .item b{font-variant-numeric:tabular-nums}
.setup{padding:10px 12px;border-radius:8px;background:var(--maybe-soft);color:var(--fg);font-size:14px;margin-bottom:10px}
.setup input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--fg)}
/* map */
.lmap{width:100%;height:min(64vh,620px);border-radius:8px;background:var(--bg);isolation:isolate}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lmap .leaflet-tile-pane{filter:brightness(.8) contrast(1.05) saturate(.7)}}
:root[data-theme="dark"] .lmap .leaflet-tile-pane{filter:brightness(.8) contrast(1.05) saturate(.7)}
.mk{width:26px;height:26px;border-radius:50%;background:var(--ink-soft);border:1.5px solid var(--ink);color:var(--ink);font:700 11px/23px var(--body);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mk.plan{background:var(--ink);color:#fff}.mk.st-yes{background:var(--yes);border-color:var(--yes);color:#fff}.mk.st-no{opacity:.4}.mk.sel{box-shadow:0 0 0 3px var(--fg)}.mk.done{background:var(--ok);border-color:var(--ok);color:#fff}
.mk.hotel{background:var(--fg);border-color:var(--paper);color:var(--paper);font-size:13px}
.mk.me{background:#fff;border:3px solid #2a8af0;width:18px;height:18px;box-shadow:0 0 0 6px rgba(42,138,240,.25)}
.leaflet-popup-content{font-family:var(--body);font-size:13px;margin:10px 12px;max-width:260px}.leaflet-popup-content .name{font-size:14px}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--paper);color:var(--fg)}
.leaflet-control-attribution{font-size:10px}
.mapbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.mapfilters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.mapfilters .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.mapfilters .hint{margin-left:auto}
.detail{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;font-size:14px;min-height:40px}
.empty{color:var(--muted)}
/* essentials */
.ess{display:grid;gap:12px}
@media (min-width:900px){.ess{grid-template-columns:1fr 1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;align-items:baseline}
.kv dt{color:var(--muted);font-size:12.5px}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.taxi{font-size:22px;line-height:1.35;padding:12px;border-radius:10px;background:var(--bg);margin-top:8px;word-break:keep-all}
.wx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wx .d{text-align:center;padding:8px 4px;border-radius:8px;background:var(--bg);font-size:12.5px}
.wx .d b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.wx .d small{color:var(--muted);display:block}
.yen{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.yen input,.spendform input,.nums input,.addform input,.addform select,.addform textarea{font:inherit;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--fg);min-height:40px;width:100%}
.yen output{font-variant-numeric:tabular-nums;font-weight:700}
.spendlist{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:14px}
.spendlist .s{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 8px;background:var(--bg);border-radius:6px}
.spendform{display:grid;grid-template-columns:1fr 1.6fr auto;gap:6px;margin-top:8px;align-items:end}
.phr{display:grid;gap:6px}
.phr .p{display:grid;grid-template-columns:1fr;gap:1px;padding:8px 10px;background:var(--bg);border-radius:8px}
.phr .p b{font-size:17px}
.phr .p i{font-style:normal;color:var(--muted);font-size:12.5px}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
/* add form (sheet) */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--paper);color:var(--fg);width:min(100%,560px);max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.addform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addform label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.addform .full{grid-column:1/-1}
.addform textarea{min-height:56px;resize:vertical}
.fab{display:none!important;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;border-radius:999px;background:var(--ink);color:#fff;border:0;padding:12px 16px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;display:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;max-width:min(92vw,420px);z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--ink);width:0}
.hint{font-size:12.5px;color:var(--muted)}
/* ---- desktop: top nav, map with a side panel */
@media (min-width:900px){
  body{padding-bottom:32px}
  .nav{position:sticky;top:0;bottom:auto;order:-1;border-top:0;border-bottom:1px solid var(--line);justify-content:flex-start;gap:4px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
  .nav::before{content:"東京";font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink);margin-right:10px;align-self:center}
  .nav button{flex:0 0 auto;max-width:none;flex-direction:row;gap:8px;font-size:14px;padding:8px 14px;border-radius:8px}
  .nav button svg{width:18px;height:18px}
  .nav button[aria-selected="true"]{background:var(--ink-soft)}
  .top{padding-top:18px}
  #view-map .card{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-areas:"bar bar" "prog prog" "map detail";gap:12px 16px}
  #view-map .mapbar{grid-area:bar;margin:0}
  #view-map .progress{grid-area:prog}
  #view-map .mapfilters{grid-area:bar;margin-top:46px}
  #view-map .mapbar{align-self:start}
  #view-map .lmap{grid-area:map;height:min(70vh,720px)}
  #view-map .detail{grid-area:detail;border-top:0;border-left:1px solid var(--line);padding:0 0 0 16px;margin:0;max-height:min(70vh,720px);overflow:auto}
  #view-map .detail .row{cursor:default}
  .toast{bottom:32px}
}

// ============================================================ hours
// p.hours = {Mon:[[start,end],...],...}; end may exceed 1440 (past midnight). [] = closed that day. null = unknown.
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function weekdayForTripDay(dayKey){ const td=tripDates(); return td ? weekdayOf(td[dayKey]) : dayKey; }  // trip days are literally Fri..Mon
function intervalsOn(p, wd){
  if(!p.hours) return null;
  const prev = WD[(WD.indexOf(wd)+6)%7];
  const own = p.hours[wd]; const spill = (p.hours[prev]||[]).filter(([s,e])=>e>1440).map(([s,e])=>[0,e-1440]);
  if(own===undefined && !spill.length) return null;
  return [...spill, ...(own||[])];
}
// status at minute m on weekday wd: {known, open, until, opensAt, closedAllDay}
function openStatus(p, wd, m){
  const iv = intervalsOn(p, wd);
  if(iv===null) return {known:false};
  if(!iv.length) return {known:true, open:false, closedAllDay:true};
  for(const [s,e] of iv) if(m>=s && m<e) return {known:true, open:true, until:e};
  const next = iv.filter(([s])=>s>m).sort((a,b)=>a[0]-b[0])[0];
  return {known:true, open:false, opensAt: next ? next[0] : null, closedAllDay:false};
}
function hoursLine(p, dayKey, m){
  if(!p.hours || !dayKey || !DAYS.includes(dayKey)) return "";

  if(!st.known) return "";
  if(st.closedAllDay) return `<div class="hours warn">Closed on ${DAYNAMES[dayKey]}</div>`;
  if(m==null){ const iv=intervalsOn(p,dayKey); return `<div class="hours">${DAYNAMES[dayKey]}: ${iv.map(([s,e])=>fmt(s)+"–"+fmt(e)).join(", ")}</div>`; }
  if(st.open) return `<div class="hours open">Open until ${fmt(st.until)}${st.until-m<=45?" · closes soon":""}</div>`;
  if(st.opensAt!=null) return `<div class="hours warn">Closed at ${fmt(m)} · opens ${fmt(st.opensAt)}</div>`;
  return `<div class="hours warn">Closed by ${fmt(m)} on ${DAYNAMES[dayKey]}</div>`;
}
// warning when the planned day/time falls outside opening hours
function planConflict(p){

  const st = openStatus(p, d, m==null ? 12*60 : m);

  if(m!=null && st.open && st.until-m<40) return `Closes ${fmt(st.until)}, only ${st.until-m} min after ${fmt(m)}`;
  return "";

function km(a, b){ if(a.lat==null||b.lat==null) return null; const R=6371, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180, la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180; const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function travel(a, b){
  const d = km(a,b); if(d==null) return null;
  if(a.id==="haneda" || b.id==="haneda") return {min:40, mode:"train", km:d};
  if(d < 1.3) return {min:Math.max(3, Math.round(d*1000/75)), mode:"walk", km:d};
  return {min:Math.round(12 + 3*d), mode:"train", km:d};
}

function b64e(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64d(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; return decodeURIComponent(escape(atob(s))); }
function exportUrl(){ const u=new URL(location.href); u.hash="p="+b64e(JSON.stringify(store)); return u.toString(); }
(function importFromHash(){ const m=location.hash.match(/p=([A-Za-z0-9_-]+)/); if(!m) return; try{ const inc=JSON.parse(b64d(m[1])); if(mergeIncoming(inc)){ for(const id in inc) outbox[id]=store[id]; saveOutbox(); } history.replaceState(null,"",location.pathname+location.search); }catch(e){} })();

// ============================================================ cached external data (weather, FX)
async function cached(key, maxAgeMs, loader){
  const c = LS.get(key, null);
  if(c && Date.now()-c.t < maxAgeMs) return c.v;
  try{ const v = await loader(); LS.set(key, {t:Date.now(), v}); return v; }catch(e){ return c ? c.v : null; }
}
async function loadWeather(){
  const td = tripDates(); const n = tokyoNow();
  const start = td ? td.Fri : n.date, end = td ? td.Mon : addDays(n.date, 3);
  const ahead = Math.round((Date.parse(start)-Date.parse(n.date))/864e5);
  if(ahead > 15 || ahead < -4) return {tooFar:true, start};
  return cached("tokyo-trip-wx-"+start, 3*3600e3, async()=>{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=35.67&longitude=139.77&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&start_date=${start}&end_date=${end}`;
    const r = await fetch(u); const j = await r.json(); if(!j.daily) throw new Error("no data"); return j.daily;
  });
}
const WXCODE = c => c===0?"☀️ Clear":c<=2?"🌤 Mostly sunny":c===3?"☁️ Cloudy":c<=49?"🌫 Fog":c<=59?"🌦 Drizzle":c<=69?"🌧 Rain":c<=79?"🌨 Snow":c<=84?"🌧 Showers":"⛈ Storms";
async function loadFx(){
  return cached("tokyo-trip-fx", 12*3600e3, async()=>{ const r=await fetch("https://api.frankfurter.app/latest?from=USD&to=JPY"); const j=await r.json(); if(!j.rates||!j.rates.JPY) throw new Error("no rate"); return {rate:j.rates.JPY, date:j.date}; });
}
function fxRate(){ const manual = LS.get("tokyo-trip-fx-manual", null); if(manual) return {rate:manual, src:"your rate"}; const c=LS.get("tokyo-trip-fx", null); if(c&&c.v) return {rate:c.v.rate, src:"ECB "+c.v.date}; return {rate:150, src:"fallback estimate"}; }

}

// ============================================================ PLAN view
const TABS = [
  {id:"fri", label:"Fri", filter:p=>dayOf(p).includes("Fri")||(!docOf(p.id).day&&(p.layer==="Late dinner"||p.layer==="Hotel & transport"))},
  {id:"sat", label:"Sat", filter:p=>dayOf(p).includes("Sat")},
  {id:"sun", label:"Sun", filter:p=>dayOf(p).includes("Sun")},
  {id:"mon", label:"Mon", filter:p=>dayOf(p).includes("Mon")},
  {id:"spa", label:"Lidia spa", filter:p=>p.layer==="Lidia spa"},
  {id:"all", label:"Everything", filter:p=>true},
];
function visibleItems(){
  const t = TABS.find(x=>x.id===curTab()) || TABS[0];
  return PLACES.filter(p=>t.filter(p)).filter(p=>!whoFilter || !whoOf(p) || whoOf(p).split(",").includes(whoFilter)).filter(p=>!onlyPicks || confirmedish(p)).filter(p=>!onlyToBook || resvOpen(p)).filter(p=>showNo || stateOf(p)!=="no");
}
function slotKey(p){ const tt=timeOf(p); const t=tt.match(/^\d\d:\d\d/); return t?t[0]:(tt||""); }
function renderPlan(){
  const ct = curTab();
  document.getElementById("tabs").innerHTML = TABS.map(t=>`<button type="button" class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id===ct}">${t.label}</button>`).join("");
  document.getElementById("chips").innerHTML = [["","Everyone"],...WHO].map(([k,n])=>`<button type="button" class="chip" data-who="${k}" aria-pressed="${whoFilter===k}">${n}</button>`).join("") + `<button type="button" class="chip" data-picks="1" aria-pressed="${onlyPicks}">Booked + picks only</button><button type="button" class="chip" data-showno="1" aria-pressed="${showNo}">Show crossed-out${(function(){ const n=PLACES.filter(p=>(TABS.find(x=>x.id===curTab())||TABS[0]).filter(p) && stateOf(p)==="no").length; return n?` (${n})`:""; })()}</button><button type="button" class="chip" data-toresv="1" aria-pressed="${onlyToBook}">Still to reserve${PLACES.filter(p=>resvOpen(p)&&confirmedish(p)).length?` (${PLACES.filter(p=>resvOpen(p)&&confirmedish(p)).length})`:""}</button><button type="button" class="chip add" id="addbtn">＋ Add idea</button>`;
  const items = visibleItems();
  // group by time slot
  const groups = new Map();
  for(const p of items){ const k=slotKey(p); if(!groups.has(k)) groups.set(k, []); groups.get(k).push(p); }
  const keys = [...groups.keys()].sort((a,b)=>{ const ta=toMin(a), tb=toMin(b); if(ta!=null&&tb!=null) return ta-tb; if(ta!=null) return -1; if(tb!=null) return 1; return a.localeCompare(b); });
  let num = 0, html = "";
  for(const k of keys){
    html += `<div class="slot"><div class="t">${esc(k||"Anytime")}</div><div class="rows">${groups.get(k).map(p=>rowHtml(p, ++num)).join("")}</div></div>`;
  }
  const dayLabel = DAYS.find(d=>d.toLowerCase()===curTab()) ? DAYNAMES[DAYS.find(d=>d.toLowerCase()===curTab())] : "the weekend";
  html += `<button type="button" class="btn suggest" id="suggestbtn">＋ Suggest an idea for ${esc(dayLabel)}</button>`;
  document.getElementById("list").innerHTML = html;
  renderTimeline();
}

// ---------- timeline
function timelineEvents(dayKey){
  const evs = [];
  for(const p of PLACES){ if(p.layer==="Hotel & transport" || !confirmedish(p) || doneOf(p)==="skip") continue; const d = DAYS.find(x=>dayOf(p).startsWith(x)); if(d!==dayKey) continue; const t=toMin(timeOf(p)); if(t==null) continue; evs.push({id:p.id, p, name:p.name, t, lat:p.lat, lng:p.lng, pick:!bookedOf(p), done:doneOf(p)==="done"}); }
  if(dayKey==="Fri"){ evs.push({id:"haneda", p:byId.haneda, name:"Land at Haneda T3", t:FLIGHT.landMin, lat:byId.haneda.lat, lng:byId.haneda.lng, anchor:true}); evs.push({id:"hotel", p:byId.hotel, name:"Check in (estimate)", t:FLIGHT.checkinMin, lat:HOTEL.lat, lng:HOTEL.lng, anchor:true}); }
  if(dayKey==="Mon"){ evs.push({id:"hotel", p:byId.hotel, name:"Leave the hotel for Haneda", t:FLIGHT.leaveHotelMin, lat:HOTEL.lat, lng:HOTEL.lng, anchor:true}); evs.push({id:"haneda", p:byId.haneda, name:"Flight to San Francisco", t:FLIGHT.departMin, lat:byId.haneda.lat, lng:byId.haneda.lng, anchor:true}); }
  evs.sort((a,b)=>a.t-b.t);
  return evs;
}
function renderTimeline(){
  const el = document.getElementById("timeline"); let html = "";
  const ct = curTab(); const dayKeys = ct==="all" || ct==="spa" ? DAYS : [ct[0].toUpperCase()+ct.slice(1)];
  for(const d of dayKeys){
    const evs = timelineEvents(d); if(!evs.length) continue;
    html += `<div class="tlday">${DAYNAMES[d]}</div>`;
    evs.forEach((e,i)=>{
      html += `<div class="tlev ${e.anchor?"anchor":""} ${e.done?"done":""} ${selected===e.id?"sel":""}" data-id="${e.id}"><div class="tlt">${fmt(e.t)}</div><div class="tln">${esc(e.name)}${e.pick?' <span class="hint">(pick)</span>':""}${e.p&&resvOpen(e.p)?' <span class="resvflag">⚠ not reserved</span>':e.p&&reservedOf(e.p)?' <span class="resvok">✓ reserved</span>':""}</div></div>`;
      const nx = evs[i+1]; if(nx){ const tr = travel(e, nx); const gap = nx.t-e.t; if(tr){ const tight = gap < tr.min+20; html += `<div class="tlgo ${tight?"tight":gap<tr.min+45?"ok":""}"><span>${travelText(tr)}</span><span>${tight?"<b>tight</b> · ":""}leave by <b>${fmt(nx.t-tr.min)}</b></span></div>`; } }
    });
  }
  el.innerHTML = html || `<span class="empty">Nothing with a time yet. Mark items ✓ or booked and give them a time.</span>`;
}

// ============================================================ NOW view
function renderNow(){
  const el = document.getElementById("now"); const n = tokyoNow(); const tk = todayKey(); const td = tripDates();
  let html = "";
  if(!td){
    html += `<div class="card"><div class="setup"><b>When does the weekend start?</b> Set the Friday you land and this page will show what's next, countdowns and the forecast.<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><input type="date" id="friday"><button type="button" class="btn primary" id="savefriday">Save</button></div></div></div>`;
  }
  const dayKey = tk || (daysUntilTrip()!=null && daysUntilTrip()>0 ? "Fri" : "Sat");
  const evs = timelineEvents(dayKey);
  // "current" = the last event that has started and isn't done; "next" = the first one still ahead
  const future = tk ? evs.filter(e=>e.t > n.min && !e.done) : evs;
  const current = tk ? [...evs].reverse().find(e=>e.t <= n.min && !e.done && !e.anchor) : null;
  const next = future[0] || null;
  const origin = myPos || current || (function(){ const prev=[...evs].reverse().find(e=>e.t<=n.min); return prev || HOTEL; })();
  const originName = myPos ? "here" : origin===HOTEL || origin.id==="hotel" ? "the hotel" : (origin.name||"").replace(/\s*\(.*$/,"");
  html += `<div class="nowgrid"><div class="card">`;
  if(tk){
    html += `<div class="tag">${DAYNAMES[tk]} · ${fmt(n.min)} in Tokyo</div>`;
    if(current) html += `<p class="sub">Now: <b>${esc(current.name)}</b> since ${fmt(current.t)} · <button type="button" class="copy" data-done="${current.id}">done</button></p>`;
    if(next){
      const tr = travel(origin, next); const until = next.t - n.min; const leave = tr ? next.t - tr.min : null;
      html += `<div class="big">${esc(next.name)}</div>
        <p class="countdown">at <b>${fmt(next.t)}</b> · in <b>${until>=60?Math.floor(until/60)+" h "+(until%60)+" min":until+" min"}</b></p>
        ${leave!=null ? `<div class="leaveby ${leave-n.min<10?"tight":""}">Leave ${esc(originName)} by ${fmt(leave)} · ${travelText(tr)}${myPos?"":" · tap Locate on the map for your real position"}</div>` : ""}
        ${next.p ? resvBadge(next.p) : ""}
        ${next.p ? hoursLine(next.p, tk, n.min) : ""}
        ${next.p && next.p.note ? `<p class="note">${esc(next.p.note)}</p>`:""}
        ${next.p && docOf(next.id).note ? `<p class="usernote">📝 ${esc(docOf(next.id).note)}</p>`:""}
        <div class="row-actions">
          ${next.p && next.p.lat!=null ? `<a class="btn primary" href="${dirUrl(next.p)}" target="_blank" rel="noopener">Directions</a>`:""}
          ${next.p && next.p.phone ? `<a class="btn" href="tel:${esc(next.p.phone.replace(/[^+\d]/g,""))}">Call</a>`:""}
          ${next.p && next.p.address ? `<button type="button" class="btn" data-driver="${next.id}">Show to driver</button>`:""}
          ${!next.anchor ? `<button type="button" class="btn" data-done="${next.id}">Done ✓</button><button type="button" class="btn" data-skip="${next.id}">Skip</button>`:""}
          <button type="button" class="btn" data-goto="${next.id}">On map</button>
        </div>`;
    } else {
      html += `<div class="big">Nothing more on the plan today</div><p class="sub">Open Plan to pick something, or suggest an idea.</p><div class="row-actions"><button type="button" class="btn" id="suggestbtn">＋ Suggest an idea</button></div>`;
    }
  } else if(td){
    const du = daysUntilTrip();
    html += `<div class="tag">${du>0?`${du} day${du===1?"":"s"} to go`:"the weekend is over"}</div><div class="big">${du>0?"Friday plan preview":"Thanks for coming"}</div><p class="sub">Landing ${fmt(FLIGHT.landMin)} at Haneda · GOKU sukiyaki at 22:00 · leave hotel Monday ${fmt(FLIGHT.leaveHotelMin)}</p>`;
  } else {
    html += `<div class="big">Saturday preview</div>`;
  }
  // compact list for the day
  html += `<div class="compact">` + evs.map(e=>`<div class="item ${e.done?"done":""} ${next&&e.id===next.id&&e.t===next.t?"":""}" data-goto="${e.id}"><b>${fmt(e.t)}</b><span>${esc(e.name)}${e.pick?' <span class="hint">(pick)</span>':""}</span>${e.anchor?"<span></span>":`<button type="button" class="copy" data-done="${e.id}" aria-label="Toggle done">${e.done?"undo":"done"}</button>`}</div>`).join("") + `</div>`;
  html += `</div>`;
  // right column: weather + quick cards
  html += `<div><div class="card"><h2>Weather</h2><div id="wx" class="hint">Loading forecast…</div></div>
    <div class="card" style="margin-top:12px"><h2>Open now near the hotel</h2><div id="opennow"></div></div></div></div>`;
  el.innerHTML = html;
  renderWeather(); renderOpenNow();
}
async function renderWeather(){
  const el = document.getElementById("wx"); if(!el) return;
  const w = await loadWeather();
  if(!w){ el.textContent = "Forecast not available offline."; return; }
  if(w.tooFar){ el.textContent = `Forecast appears about two weeks before ${w.start}.`; return; }
  const td = tripDates();
  el.innerHTML = `<div class="wx">${w.time.map((d,i)=>{ const key = td ? DAYS.find(k=>td[k]===d) : null; return `<div class="d"><small>${key?DAYNAMES[key].slice(0,3):d.slice(5)}</small><b>${Math.round(w.temperature_2m_max[i])}°</b><small>${Math.round(w.temperature_2m_min[i])}° · ${w.precipitation_probability_max[i]??"–"}% rain</small><small>${WXCODE(w.weather_code[i])}</small></div>`; }).join("")}</div>`;
}
function renderOpenNow(){
  const el = document.getElementById("opennow"); if(!el) return;
  const n = tokyoNow(); const wd = n.weekday;
  const list = PLACES.filter(p=>p.hours && p.lat!=null && stateOf(p)!=="no").map(p=>({p, st:openStatus(p, wd, n.min), d:km(myPos||HOTEL, p)})).filter(x=>x.st.known && x.st.open).sort((a,b)=>a.d-b.d).slice(0,8);
  el.innerHTML = list.length ? `<div class="compact">${list.map(x=>`<div class="item" data-goto="${x.p.id}"><b>${x.d<1?Math.round(x.d*1000)+" m":x.d.toFixed(1)+" km"}</b><span>${esc(x.p.name)}</span><span class="hint">to ${fmt(x.st.until)}</span></div>`).join("")}</div><p class="hint" style="margin:8px 0 0">Distances from ${myPos?"your position":"the hotel"} · ${esc(wd)} ${fmt(n.min)} Tokyo time.</p>` : `<span class="empty">Nothing with known hours is open right now.</span>`;
}

// ============================================================ MAP
function ensureMap(){
  if(LMAP) return LMAP;
  LMAP = L.map("map", {zoomControl:true, attributionControl:true, tap:true});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(LMAP);

const MAP_STATUSES = [["booked","Booked"],["yes","✓ Yes"],["maybe","? Maybe"],["no","✕ No"],["none","Unvoted"]];

function mapVisible(p){

function renderMap(){
  renderMapFilters();

  const seen = new Set(); let num = 0;
  for(const p of PLACES){
    if(p.lat==null) continue; num++;
    if(!mapVisible(p)) continue; seen.add(p.id);
    const icon = L.divIcon({className:"", html:`<div class="${markerClass(p)}">${p.id==="hotel"?"H":num}</div>`, iconSize:[26,26], iconAnchor:[13,13], popupAnchor:[0,-12]});
    if(MARKERS[p.id]){ MARKERS[p.id].setIcon(icon); MARKERS[p.id].setLatLng([p.lat,p.lng]); }
    else { const m = L.marker([p.lat,p.lng], {icon, title:p.name, zIndexOffset: p.id==="hotel"?1000:0}).addTo(LMAP); m.on("click", ()=>{ select(p.id, false); }); MARKERS[p.id]=m; }

// ---------- offline map tiles
function tileList(){
  const pts = PLACES.filter(p=>p.lat!=null && p.id!=="haneda"); if(!pts.length) return [];
  const la0=Math.min(...pts.map(p=>p.lat))-0.004, la1=Math.max(...pts.map(p=>p.lat))+0.004, lo0=Math.min(...pts.map(p=>p.lng))-0.004, lo1=Math.max(...pts.map(p=>p.lng))+0.004;
  const tx=(lat,lng,z)=>{ const n=2**z; return [Math.floor((lng+180)/360*n), Math.floor((1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*n)]; };
  const out=[]; const add=(a0,a1,o0,o1,z)=>{ const [x0,y1]=tx(a0,o0,z), [x1,y0]=tx(a1,o1,z); for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) out.push(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`); };
  for(let z=12; z<=15; z++) add(la0,la1,lo0,lo1,z);
  add(HOTEL.lat-0.011, HOTEL.lat+0.011, HOTEL.lng-0.014, HOTEL.lng+0.014, 16);      // hotel neighbourhood in detail
  add(35.5405, 35.5505, 139.762, 139.776, 15);                                        // Haneda T3
  return [...new Set(out)];
}
async function saveMapOffline(){
  if(!("caches" in window)){ toast("Offline storage isn't available in this browser."); return; }
  const urls = tileList(); const prog = document.getElementById("tileprog"); const bar = prog.querySelector("i"); prog.hidden=false;
  const cache = await caches.open("tokyo-tiles-v1"); let done=0, failed=0;
  const worker = async()=>{ while(urls.length){ const u=urls.shift(); try{ if(!(await cache.match(u))) await cache.add(new Request(u, {mode:"no-cors"})); }catch(e){ failed++; } done++; bar.style.width=Math.round(done/(done+urls.length)*100)+"%"; } };
  await Promise.all([worker(), worker()]);
  prog.hidden=true; document.getElementById("maphint").textContent = `Map saved for offline (${done-failed} tiles${failed?`, ${failed} failed`:""}).`;
  LS.set("tokyo-trip-tiles-saved", Date.now());
}

function parseLatLng(s){
  s = String(s||"");
  let m = s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || s.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+),(-?\d+\.\d+)/) || s.match(/^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/);
  return m ? {lat:+m[1], lng:+m[2]} : null;
}

  const dr = t.closest("[data-driver]"); if(dr){ e.stopPropagation(); showDriver(byId[dr.dataset.driver]); return; }
  const gt = t.closest("[data-goto]"); if(gt && !t.closest("[data-done]")){ select(gt.dataset.goto, true); return; }
  const dn = t.closest("[data-done]"); if(dn){ e.stopPropagation(); const id=dn.dataset.done; await writeDoc(id, nextDoc(id, {done: doneOf(byId[id])==="done" ? null : "done"})); return; }
  const sk = t.closest("[data-skip]"); if(sk){ e.stopPropagation(); const id=sk.dataset.skip; await writeDoc(id, nextDoc(id, {done:"skip"})); return; }
  if(t.closest("#savefriday")){ const v=document.getElementById("friday").value; if(!v) return toast("Pick the Friday"); if(weekdayOf(v)!=="Fri" && !confirm(`${v} is a ${weekdayOf(v)}. Save anyway?`)) return; await writeDoc("_settings", nextDoc("_settings", {fridayDate:v})); toast("Trip dates saved"); tab=null; renderAll(); return; }
  if(t.closest("#locate")){ locate(); return; }
  if(t.closest("#fitall")){ fitAll(); return; }
  const md = t.closest("[data-mday]"); if(md){ mapDay = md.dataset.mday; ensureMap(); renderMap(); fitAll(); return; }
  const ms = t.closest("[data-mst]"); if(ms){ const k=ms.dataset.mst; if(mapStatus.has(k)){ if(mapStatus.size>1) mapStatus.delete(k); } else mapStatus.add(k); ensureMap(); renderMap(); fitAll(); return; }
  if(t.closest("#savemap")){ saveMapOffline(); return; }
  if(t.closest("#fxedit")){ const v = prompt("Yen per 1 US dollar (leave empty to use the live rate):", String(fxRate().rate)); if(v===null) return; if(v.trim()==="") LS.set("tokyo-trip-fx-manual", null); else if(+v>0) LS.set("tokyo-trip-fx-manual", +v); renderEss(); return; }
  if(t.closest("#sadd")){ const a=+document.getElementById("samt").value, l=document.getElementById("slabel").value.trim(); if(!(a>0)) return toast("Enter an amount in yen"); const id=uid("s"); await writeDoc(id, nextDoc(id, {spend:true, amount:a, label:l, day: todayKey()||""})); return; }
  const sd = t.closest("[data-sdel]"); if(sd){ await writeDoc(sd.dataset.sdel, nextDoc(sd.dataset.sdel, {deleted:true})); return; }
  if(t.closest("#exportbtn")){ copyText(exportUrl()); return; }
  if(t.closest("#installbtn")){ if(deferredInstall){ deferredInstall.prompt(); deferredInstall=null; } else toast("Use your browser menu → Add to Home screen / Install app"); return; }
  // row-level controls
  const rv = t.closest("[data-resv]"); if(rv){ e.stopPropagation(); const id=rv.dataset.resv, p=byId[id]; const cur=reservedOf(p); await writeDoc(id, nextDoc(id, {reserved: cur ? (p.reserved ? false : null) : true})); return; }
  const pk = t.closest(".pick"); if(pk){ e.stopPropagation(); const id=pk.dataset.id, s=pk.dataset.s; await writeDoc(id, nextDoc(id, {state: stateOf(byId[id])===s ? null : s})); return; }
  const bk = t.closest(".book"); if(bk){ e.stopPropagation(); const id=bk.dataset.id, p=byId[id]; const cur=bookedOf(p); const next = cur ? (p.kind==="plan" ? false : null) : true; await writeDoc(id, nextDoc(id, {booked: next, state: next===true ? "yes" : stateOf(p)||null})); return; }
  const db = t.closest(".doneb"); if(db){ e.stopPropagation(); const id=db.dataset.id; const cur=doneOf(byId[id]); await writeDoc(id, nextDoc(id, {done: cur==="" ? "done" : cur==="done" ? "skip" : null})); return; }
  const w = t.closest(".when"); if(w){ e.stopPropagation(); editing = editing===w.dataset.id ? null : w.dataset.id; renderPlan(); renderDetail(); return; }
  const ed = t.closest(".editwhen");
  if(ed){
    e.stopPropagation(); const id = ed.dataset.id, p = byId[id];
    if(t.closest(".esave")){
      const day = ed.querySelector(".eday").value, time = ed.querySelector(".etime").value, note = ed.querySelector(".enote").value.trim();
      const who = [...ed.querySelectorAll(".ewho:checked")].map(x=>x.value).join(",");
      const origDay = (p.custom ? "" : p.day.split("/")[0]), origTime = p.custom ? "" : (toMin(p.time)!=null ? fmt(toMin(p.time)) : "");
      let patch = p.custom ? {day, time, note, who} : { day: day!==origDay ? day : null, time: time!==origTime ? time : null, note, who: who || null };
      if(p.custom){ const name=ed.querySelector(".ename").value.trim(), link=ed.querySelector(".elink").value.trim(); const ll=parseLatLng(link); patch = {...patch, name: name||p.name, cat: ed.querySelector(".ecat").value, resv: ed.querySelector(".eresv").value || null, link: /^https?:/.test(link)?link:"", lat: ll?ll.lat:(p.lat??null), lng: ll?ll.lng:(p.lng??null)}; }
      editing=null; await writeDoc(id, nextDoc(id, patch)); return;
    }
    if(t.closest(".ereset")){ editing=null; await writeDoc(id, nextDoc(id, {time:null, day:null})); return; }
    if(t.closest(".edel")){ if(!confirm("Delete this item for everyone?")) return; editing=null; if(selected===id) selected=null; await writeDoc(id, nextDoc(id, {deleted:true})); return; }
    if(t.closest(".ecancel")){ editing=null; renderPlan(); renderDetail(); return; }
    return;
  }
  const r = t.closest(".row,.tlev"); if(r && !t.closest("a,button,input,select,textarea")){ select(r.dataset.id, isMobile()); return; }
});
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.classList.contains("row")) select(e.target.dataset.id, isMobile()); if(e.key==="Escape"){ closeSheet(); editing=null; renderPlan(); } });
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.id==="yen"){ const u=document.getElementById("usd"); u.value = t.value ? (t.value/fxRate().rate).toFixed(2) : ""; }
  if(t.id==="usd"){ const y=document.getElementById("yen"); y.value = t.value ? Math.round(t.value*fxRate().rate) : ""; }
  if(t.classList.contains("contact")){ const c=LS.get("tokyo-trip-contacts", {})||{}; c[t.dataset.i]=t.value; LS.set("tokyo-trip-contacts", c); }
  if(t.id==="mename"){ me=t.value.trim(); LS.set("tokyo-trip-me", me); }
});

// ============================================================ install + service worker
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredInstall=e; });
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }

// ============================================================ boot
(function boot(){
  const tk = todayKey();
  if(!view) view = "now";
  setView(view);
  renderAll();
  loadFx().then(()=>renderEss());
  flush();
  setInterval(()=>{ renderClock(); if(view==="now") renderNow(); }, 60000);
})();

</script>
</body>
</html>
